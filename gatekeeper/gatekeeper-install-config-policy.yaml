apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: gatekeeper-operator
  namespace: rhacm-policies
spec:
  remediationAction: enforce
  disabled: false
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: gatekeeper-operator
          namespace: rhacm-policies
        spec:
          evaluationInterval:
            compliant: 10m
            noncompliant: 60s
          object-templates:
            - complianceType: mustonlyhave
              objectDefinition:
                apiVersion: operators.coreos.com/v1alpha1
                kind: Subscription
                metadata:
                  name: gatekeeper-operator-product
                  namespace: openshift-operators
                spec:
                  channel: stable
                  installPlanApproval: Automatic
                  name: gatekeeper-operator-product
                  source: redhat-operators
                  sourceNamespace: openshift-marketplace
---
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: gatekeeper-operator-config
  namespace: rhacm-policies
spec:
  remediationAction: enforce
  disabled: false
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: gatekeeper-config
          namespace: rhacm-policies
        spec:
          evaluationInterval:
            compliant: 10m
            noncompliant: 60s
          object-templates:
            - complianceType: mustonlyhave
              objectDefinition:
                apiVersion: operator.gatekeeper.sh/v1alpha1
                kind: Gatekeeper
                metadata:
                  name: gatekeeper
                  namespace: openshift-gatekeeper-system
                spec:
                  audit:
                    constraintViolationLimit: 200
                  config:
                    matches:
                      - excludedNamespaces:
                          - open-cluster-management
                          - kube-*
                          - openshift-*
                          - openshift
                          - klusterlet-*
                          - hypershift
                          - open-*
                          - hive
                          - local-*
                          - multicluster-*
                          - rhacs-*
                          - stackrox
                          - cluster-*
                          - cert-manager*
                          - assisted-installer
                          - default
                          - default-broker
                          - keycloak-*
                          - dev-clusters-broker
                          - argo-*
                          - gitlab-*
                          - konflux-*
                          - trusted-profile-analyzer
                          - trusted-artifact-signer
                          - ztp-install
                          - rhacm-policies
                          - istio-system
                        processes:
                          - '*'
            - complianceType: musthave
              objectDefinition:
                apiVersion: config.gatekeeper.sh/v1alpha1
                kind: Config
                metadata:
                  name: config
                  namespace: openshift-gatekeeper-system
                spec:
                  sync:
                    syncOnly:
                      - group: ""
                        version: "v1"
                        kind: "Pod"