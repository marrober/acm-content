apiVersion: v1
kind: Namespace
metadata:
  name: rhacm-policies
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: acm-grc-events-allow
  namespace: rhacm-policies
rules:
- apiGroups: ["", "events.k8s.io"]
  resources: ["events"]
  verbs: ["create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: acm-grc-events-allow-binding
  namespace: rhacm-policies
subjects:
- kind: ServiceAccount
  name: grc-sa
  namespace: open-cluster-management
roleRef:
  kind: Role
  name: acm-grc-events-allow
  apiGroup: rbac.authorization.k8s.io
