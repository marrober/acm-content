apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: policy-configmap
  labels:
    policy: configmap
spec:
  remediationAction: enforce
  disabled: false
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: policy-configmap-example
        spec:
          severity: medium
          namespaceSelector:
            include: ['test-*']
          object-templates: 
            - complianceType: musthave
              recreateOption: IfRequired
              objectDefinition:
                apiVersion: v1
                kind: ConfigMap
                metadata:
                  name: default-configmap-cm
                  namespace: test-1
                data:
                  cluster-environment: '{{hub- if eq .ManagedClusterLabels.environment "dev" -hub}}its dev !{{hub- else -hub}}Careful! this is production{{hub- end -hub}}'